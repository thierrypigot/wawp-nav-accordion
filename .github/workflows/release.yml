name: Release

# Publie une release GitHub avec le zip installable dans WordPress
# (Extensions > Ajouter > Téléverser) à chaque tag vX.Y.Z poussé.
# Le zip est aussi l'asset que plugin-update-checker télécharge
# pour les mises à jour automatiques (enableReleaseAssets).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant à packager (ex. v1.1.0)'
        required: true

permissions:
  contents: write

env:
  SLUG: wawp-nav-accordion

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Déterminer le tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Vérifier la cohérence tag / version du plugin
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' "$SLUG.php" | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONSTANT=$(grep -m1 -oE "WAWP_NAV_ACCORDION_VERSION', '[^']+'" "$SLUG.php" | sed -E "s/.*'([^']+)'$/\1/")
          STABLE=$(grep -m1 -iE '^Stable tag:' readme.txt | sed -E 's/^[^:]+:\s*//' | tr -d '[:space:]')
          echo "Tag: $VERSION | En-tête: $HEADER | Constante: $CONSTANT | Stable tag: $STABLE"
          for V in "$HEADER" "$CONSTANT" "$STABLE"; do
            if [ "$V" != "$VERSION" ]; then
              echo "::error::Version incohérente : le tag $TAG ne correspond pas à $V"
              exit 1
            fi
          done

      - name: Construire le zip
        run: |
          # Règles d'exclusion prises sur main : un ancien tag sans .gitattributes est packagé proprement.
          mkdir -p .git/info
          git show "origin/${{ github.event.repository.default_branch }}:.gitattributes" > .git/info/attributes 2>/dev/null || true
          git archive --format=zip --prefix="$SLUG/" -o "$SLUG.zip" "${{ steps.tag.outputs.tag }}"
          unzip -l "$SLUG.zip"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$SLUG.zip" --clobber
          else
            gh release create "$TAG" "$SLUG.zip" --title "$TAG" --generate-notes --verify-tag
          fi
